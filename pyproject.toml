[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delayed-photography"
version = "0.1.0"
description = "Compose a single time-lapse style photograph from a video (mean / max / median stacking)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "BIANG" }]
keywords = ["video", "timelapse", "long-exposure", "stacking", "photography"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "av>=12.0.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.0.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/BIANG-qilie/delayed_photography"
Repository = "https://github.com/BIANG-qilie/delayed_photography"

[tool.hatch.build.targets.wheel]
only-include = ["delayed_photography"]

[tool.hatch.build.targets.wheel.sources]
"delayed_photography" = "src/delayed_photography"

[tool.hatch.build.targets.sdist]
include = ["/src/delayed_photography", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = ["src"]
packages = ["delayed_photography"]

[[tool.mypy.overrides]]
module = ["av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
